[tool.poetry]
name = "hidraulica_condutos"
version = "0.1.0"
description = "Ferramenta para análise e dimensionamento de condutos em instalações hidráulicas."
authors = ["Diana Pereira Couto <diana.couto@ufrgs.com.br>"
            "Lucas da Silva Balensiefer <lucasbalensiefer2003@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "hidraulica_condutos", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ipykernel = ">=6,<7"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

